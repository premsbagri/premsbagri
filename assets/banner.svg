<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714" />
      <stop offset="35%" stop-color="#0a1128" />
      <stop offset="70%" stop-color="#0e172e" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.7" />
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="azure-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purple-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyan-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f0f9ff" />
      <stop offset="70%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="tag-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- Dot Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#38bdf8" fill-opacity="0.14" />
    </pattern>
  </defs>

  <style>
    .text-title {
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 48px;
      font-weight: 850;
      letter-spacing: 2px;
    }
    .text-subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 4px;
      fill: #94a3b8;
      text-transform: uppercase;
    }
    .text-exp {
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #38bdf8;
      text-transform: uppercase;
    }
    .text-tag {
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
      letter-spacing: 0.3px;
    }
    .text-metric-val {
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 17px;
      font-weight: 800;
      fill: #38bdf8;
      letter-spacing: 0.5px;
    }
    .text-metric-lbl {
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #64748b;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
  </style>

  <!-- Main Canvas Container -->
  <rect x="2" y="2" width="1196" height="326" rx="20" fill="url(#bg-canvas)" stroke="url(#card-border)" stroke-width="1.5" filter="url(#subtle-shadow)" />

  <!-- Background Decorative Grid -->
  <rect x="2" y="2" width="1196" height="326" rx="20" fill="url(#dot-grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="80" r="180" fill="url(#azure-glow)" />
  <circle cx="1020" cy="100" r="190" fill="url(#purple-glow)" />
  <circle cx="600" cy="160" r="220" fill="url(#cyan-glow)" />

  <!-- Decorative Circuit / Topo Lines -->
  <g opacity="0.2" stroke="#38bdf8" stroke-width="1" fill="none">
    <path d="M 40 40 L 140 40 L 180 80 L 260 80" />
    <circle cx="260" cy="80" r="3" fill="#38bdf8" />

    <path d="M 1160 40 L 1060 40 L 1020 80 L 940 80" />
    <circle cx="940" cy="80" r="3" fill="#818cf8" />

    <path d="M 40 290 L 120 290 L 160 250 L 220 250" />
    <circle cx="220" cy="250" r="3" fill="#38bdf8" />

    <path d="M 1160 290 L 1080 290 L 1040 250 L 980 250" />
    <circle cx="980" cy="250" r="3" fill="#818cf8" />
  </g>

  <!-- ================= CENTER CONTENT ================= -->

  <!-- Top Experience Pill -->
  <g transform="translate(420, 24)">
    <rect x="0" y="0" width="360" height="28" rx="14" fill="url(#pill-bg)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="18" cy="14" r="4.5" fill="#10b981" />
    <text x="32" y="14" dominant-baseline="middle" class="text-exp">11.4+ YRS IT EXP  •  6+ YRS DEVSECOPS</text>
  </g>

  <!-- Primary Headline: Prem S Bagri -->
  <text x="600" y="98" text-anchor="middle" class="text-title" fill="url(#name-grad)" filter="url(#soft-glow)">PREM S BAGRI</text>

  <!-- Subtitle: Role Title -->
  <text x="600" y="128" text-anchor="middle" class="text-subtitle">SENIOR DEVSECOPS &amp; AZURE CLOUD ARCHITECT</text>

  <!-- Horizontal Accent Divider -->
  <g transform="translate(420, 144)">
    <line x1="0" y1="0" x2="360" y2="0" stroke="url(#card-border)" stroke-width="1.5" />
    <circle cx="180" cy="0" r="3" fill="#38bdf8" />
  </g>

  <!-- 4 Core Pillars Pills (Balanced Row) -->
  <g transform="translate(110, 162)">

    <!-- Pill 1: Azure Landing Zones -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="230" height="38" rx="10" fill="url(#tag-bg)" stroke="#334155" stroke-width="1" />
      <!-- Cloud Icon SVG -->
      <path d="M22 23 C20 23 18.5 21.8 18.5 20 C18.5 17.5 20.5 15.5 23 15.5 C23.6 13 25.8 11 28.5 11 C31.8 11 34.3 13.5 34.5 16.7 C35.7 17.2 36.5 18.5 36.5 20 C36.5 21.8 35 23 33 23 Z" fill="#0ea5e9" />
      <text x="44" y="19" dominant-baseline="middle" class="text-tag">Azure Landing Zones (CAF)</text>
    </g>

    <!-- Pill 2: Terraform IaC -->
    <g transform="translate(250, 0)">
      <rect x="0" y="0" width="230" height="38" rx="10" fill="url(#tag-bg)" stroke="#334155" stroke-width="1" />
      <!-- Terraform Box Icon SVG -->
      <polygon points="20,13 27,17 27,25 20,21" fill="#844fba" />
      <polygon points="28,17 35,13 35,21 28,25" fill="#a855f7" />
      <polygon points="28,26 35,22 35,30 28,34" fill="#c084fc" />
      <text x="44" y="19" dominant-baseline="middle" class="text-tag">Modular Terraform IaC</text>
    </g>

    <!-- Pill 3: Azure DevOps CI/CD -->
    <g transform="translate(500, 0)">
      <rect x="0" y="0" width="230" height="38" rx="10" fill="url(#tag-bg)" stroke="#334155" stroke-width="1" />
      <!-- Pipeline Infinity / Sync Icon SVG -->
      <path d="M21 21 A 4 4 0 1 1 29 21 A 4 4 0 1 1 37 21" stroke="#0284c7" stroke-width="2.2" stroke-linecap="round" fill="none" />
      <circle cx="21" cy="21" r="1.5" fill="#38bdf8" />
      <circle cx="37" cy="21" r="1.5" fill="#38bdf8" />
      <text x="44" y="19" dominant-baseline="middle" class="text-tag">Automated CI/CD YAML</text>
    </g>

    <!-- Pill 4: Shift-Left Security -->
    <g transform="translate(750, 0)">
      <rect x="0" y="0" width="230" height="38" rx="10" fill="url(#tag-bg)" stroke="#334155" stroke-width="1" />
      <!-- Shield Icon SVG -->
      <path d="M22 14 L29 11 L36 14 C36 21 29 26 29 26 C29 26 22 21 22 14 Z" fill="#1e1b4b" stroke="#10b981" stroke-width="1.8" stroke-linejoin="round" />
      <path d="M27 18 L29 20 L32 16" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="44" y="19" dominant-baseline="middle" class="text-tag">Shift-Left Security Gate</text>
    </g>

  </g>

  <!-- ================= BOTTOM STATS STRIP ================= -->
  <g transform="translate(80, 226)">
    <!-- Container Bar -->
    <rect x="0" y="0" width="1040" height="72" rx="14" fill="#0b1120" fill-opacity="0.8" stroke="#1e293b" stroke-width="1" />

    <!-- Stat 1 -->
    <g transform="translate(30, 16)">
      <text x="95" y="14" text-anchor="middle" dominant-baseline="middle" class="text-metric-val">3 Days ➔ 4 Hours</text>
      <text x="95" y="34" text-anchor="middle" dominant-baseline="middle" class="text-metric-lbl">Release Cycle Accelerated</text>
    </g>

    <!-- Divider 1 -->
    <line x1="260" y1="16" x2="260" y2="56" stroke="#1e293b" stroke-width="1.5" />

    <!-- Stat 2 -->
    <g transform="translate(290, 16)">
      <text x="95" y="14" text-anchor="middle" dominant-baseline="middle" class="text-metric-val">2 Days ➔ &lt; 2 Hours</text>
      <text x="95" y="34" text-anchor="middle" dominant-baseline="middle" class="text-metric-lbl">Infra Provisioning Sped Up</text>
    </g>

    <!-- Divider 2 -->
    <line x1="520" y1="16" x2="520" y2="56" stroke="#1e293b" stroke-width="1.5" />

    <!-- Stat 3 -->
    <g transform="translate(550, 16)">
      <text x="95" y="14" text-anchor="middle" dominant-baseline="middle" class="text-metric-val">50+ Prod Releases</text>
      <text x="95" y="34" text-anchor="middle" dominant-baseline="middle" class="text-metric-lbl">Zero Rollback Failures</text>
    </g>

    <!-- Divider 3 -->
    <line x1="780" y1="16" x2="780" y2="56" stroke="#1e293b" stroke-width="1.5" />

    <!-- Stat 4 -->
    <g transform="translate(810, 16)">
      <text x="100" y="14" text-anchor="middle" dominant-baseline="middle" class="text-metric-val">~70% Fewer Errors</text>
      <text x="100" y="34" text-anchor="middle" dominant-baseline="middle" class="text-metric-lbl">Manual Effort Eliminated</text>
    </g>
  </g>

</svg>
