<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 260" width="100%" height="260" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d172e" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.25" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .name-title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 38px; font-weight: 800; letter-spacing: 1.5px; }
    .role-title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 3px; fill: #94a3b8; text-transform: uppercase; }
    .exp-pill { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #38bdf8; }
    .tag-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 12px; font-weight: 500; fill: #cbd5e1; }
    .metric-num { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #38bdf8; }
    .metric-lbl { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 10px; font-weight: 500; fill: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="946" height="256" rx="16" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Background Decorative Tech Grid & Accents -->
  <g opacity="0.12">
    <circle cx="850" cy="40" r="140" stroke="#38bdf8" stroke-width="1" fill="none" stroke-dasharray="4 4" />
    <circle cx="850" cy="40" r="80" stroke="#818cf8" stroke-width="1" fill="none" />
    <circle cx="100" cy="220" r="100" stroke="#0ea5e9" stroke-width="1" fill="none" stroke-dasharray="6 6" />
    <path d="M720 20 L760 60 L800 20 L840 60" stroke="#38bdf8" stroke-width="1" fill="none" />
    <path d="M150 20 L800 20" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 8" />
    <path d="M150 240 L800 240" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 8" />
  </g>

  <!-- Glowing Orbs in background -->
  <circle cx="870" cy="60" r="90" fill="#0284c7" opacity="0.15" filter="url(#glow-cyan)" />
  <circle cx="120" cy="180" r="80" fill="#6366f1" opacity="0.12" filter="url(#glow-cyan)" />

  <!-- Security Shield & Cloud Emblem (Left Side) -->
  <g transform="translate(48, 55)">
    <!-- Outer Shield Glow -->
    <path d="M50 8 L92 24 C92 70 50 96 50 96 C50 96 8 70 8 24 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#glow-soft)" />
    <!-- Inner Core -->
    <path d="M50 16 L84 29 C84 65 50 87 50 87 C50 87 16 29 16 29 Z" fill="#0284c7" opacity="0.25" />
    <!-- Azure / Cloud Icon lines inside shield -->
    <path d="M35 55 C32 55 30 53 30 50 C30 46 33 44 36 44 C37 39 41 35 47 35 C52 35 56 38 57 43 C59 42 61 42 63 44 C65 45 66 48 66 50 C66 53 64 55 61 55 Z" fill="#38bdf8" />
    <!-- Keyhole / Lock dot -->
    <circle cx="50" cy="65" r="4" fill="#f8fafc" />
    <path d="M48 65 L46 74 L54 74 L52 65 Z" fill="#f8fafc" />
  </g>

  <!-- Header Text Section -->
  <g transform="translate(180, 50)">
    <!-- Experience Pill -->
    <rect x="0" y="0" width="310" height="26" rx="13" fill="url(#badge-grad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#10b981" />
    <text x="26" y="17" class="exp-pill">11.4+ YRS IT EXP  •  6+ YRS DEVSECOPS</text>

    <!-- Main Name -->
    <text x="0" y="65" class="name-title" fill="url(#text-grad)" filter="url(#glow-soft)">PREM S BAGRI</text>

    <!-- Professional Subtitle -->
    <text x="2" y="94" class="role-title">DevSecOps Engineer | Azure Cloud &amp; Terraform Architect</text>

    <!-- Core Technology Pills -->
    <g transform="translate(0, 115)">
      <!-- Pill 1: Azure Landing Zone -->
      <rect x="0" y="0" width="168" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="17" class="tag-text">☁️ Azure Landing Zones</text>

      <!-- Pill 2: Terraform IaC -->
      <rect x="176" y="0" width="138" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="188" y="17" class="tag-text">⚡ Terraform IaC</text>

      <!-- Pill 3: Azure DevOps -->
      <rect x="322" y="0" width="142" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="334" y="17" class="tag-text">🔄 Azure DevOps CI/CD</text>

      <!-- Pill 4: DevSecOps -->
      <rect x="472" y="0" width="142" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="484" y="17" class="tag-text">🛡️ Shift-Left Security</text>
    </g>

    <!-- Key Metrics Highlight Strip -->
    <g transform="translate(0, 155)">
      <line x1="0" y1="0" x2="710" y2="0" stroke="#1e293b" stroke-width="1" />

      <!-- Metric 1 -->
      <text x="0" y="22" class="metric-num">3d ➔ 4h</text>
      <text x="0" y="36" class="metric-lbl">Release Cycle Cut</text>

      <line x1="130" y1="10" x2="130" y2="38" stroke="#334155" stroke-width="1" />

      <!-- Metric 2 -->
      <text x="150" y="22" class="metric-num">2d ➔ &lt;2h</text>
      <text x="150" y="36" class="metric-lbl">Infra Provisioning</text>

      <line x1="285" y1="10" x2="285" y2="38" stroke="#334155" stroke-width="1" />

      <!-- Metric 3 -->
      <text x="305" y="22" class="metric-num">50+ Prod</text>
      <text x="305" y="36" class="metric-lbl">0 Rollback Deployments</text>

      <line x1="465" y1="10" x2="465" y2="38" stroke="#334155" stroke-width="1" />

      <!-- Metric 4 -->
      <text x="485" y="22" class="metric-num">~70%</text>
      <text x="485" y="36" class="metric-lbl">Manual Errors Reduced</text>

      <line x1="620" y1="10" x2="620" y2="38" stroke="#334155" stroke-width="1" />

      <!-- Metric 5 -->
      <text x="638" y="22" class="metric-num">Bangalore</text>
      <text x="638" y="36" class="metric-lbl">📍 India (Open to Work)</text>
    </g>
  </g>
</svg>
